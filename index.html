<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi Thư Đến Những Vì Sao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* ---------------- THIẾT LẬP CƠ SỞ ---------------- */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; 
            overflow: hidden; background-color: #150824; touch-action: none; 
            overscroll-behavior: none; font-family: 'Cormorant Garamond', serif; color: #ffffff;
        }

        .stars-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            background-image: linear-gradient(180deg, #150824 0%, #4a2574 100%), url('assets/stars_background.png');
            background-position: center center; background-size: cover, cover;
            background-blend-mode: screen; z-index: 0; pointer-events: none; transition: opacity 1s ease-in-out;
        }

        /* ---------------- SCENE 1: GIAO DIỆN GỬI THƯ ---------------- */
        #scene-1 { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 5; transition: opacity 1s ease-in-out; }
        .cloud-right { position: absolute; bottom: -125px; right: -50px; width: 55vw; min-width: 450px; opacity: 0.8; transform: scaleX(-1); z-index: 10; pointer-events: none; }
        .piano { position: absolute; bottom: 20px; right: 50px; width: 350px; z-index: 15; filter: drop-shadow(0 0 25px #d8b4fe); pointer-events: none; transform: rotate(10deg); }
        .cauldron { position: absolute; bottom: 10px; left: 55px; width: 300px; z-index: 25; filter: drop-shadow(0 0 25px #d8b4fe); pointer-events: none; transform: rotate(-8deg); }
        .cloud-left { position: absolute; bottom: -125px; left: -50px; width: 55vw; min-width: 450px; opacity: 0.8; z-index: 30; pointer-events: none; }
        
        .paper-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 500px; height: 680px; background: url('assets/paper.png') no-repeat center center; background-size: 100% 100%; padding: 115px 60px 120px 60px; box-sizing: border-box; z-index: 20; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.6); transition: transform 0.3s ease; }
        .paper-wrapper::after { content: ''; position: absolute; top: 80px; right: 45px; width: 90px; height: 90px; background: url('assets/paper_stars.png') no-repeat center center; background-size: contain; pointer-events: none; transform: rotate(8deg); }
        .input-group { display: flex; align-items: center; margin-bottom: 6px; }
        .input-group label { color: #3b2818; font-weight: 700; font-size: 22px; margin-right: 8px; }
        .paper-input, .paper-textarea { background: transparent; border: none; outline: none; font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: #3b2818; width: 100%; }
        .paper-input { border-bottom: 2.5px dashed #8b6b4a; }
        .paper-textarea { resize: none; flex-grow: 1; margin-top: 40px; line-height: 40px; }
        
        .submit-section { position: absolute; bottom: 85px; right: 40px; display: flex; align-items: center; cursor: pointer; z-index: 40; }
        .submit-btn { background: url('assets/border.png') no-repeat center center; background-size: 100% 100%; border: none; box-shadow: none; color: #1a1a1a; padding: 12px 55px 12px 15px; font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 16px; display: flex; align-items: center; white-space: nowrap; }
        .witch-character { width: 95px; margin-left: -23px; transition: transform 1s ease; }

        /* ---------------- SCENE 2: VŨ TRỤ ---------------- */
        #scene-2 { position: fixed; top: 0; left: 0; right: 0; bottom: 0; opacity: 0; pointer-events: none; display: flex; justify-content: center; align-items: center; transition: opacity 1s ease-in-out; z-index: 100; }
        .galaxy-spiral { position: absolute; width: 170vw; height: 170vw; max-width: 900px; max-height: 900px; background: url('assets/spiral.png') no-repeat center center; background-size: contain; animation: rotateSpiral 30s linear infinite; image-rendering: pixelated; }
        .flying-envelope { position: absolute; top: 50%; left: 50%; width: 60px; z-index: 6; opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
        .envelope-fly-animation { animation: flyIntoGalaxy 4s cubic-bezier(0.36, 0, 0.66, -0.56) forwards; }
        @keyframes rotateSpiral { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes flyIntoGalaxy { 0% { transform: translate(-50%, -50%) rotate(0deg) translateX(250px) rotate(0deg) scale(1.5); opacity: 1; } 100% { transform: translate(-50%, -50%) rotate(1080deg) translateX(0px) rotate(-1080deg) scale(0); opacity: 0; } }

        /* ---------------- SCENE 3: HÒM THƯ ---------------- */
        #scene-3 { position: fixed; top: 0; left: 0; right: 0; bottom: 0; opacity: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1.5s ease-in-out; z-index: 110; }
        
        .custom-alert-box { position: absolute; top: 8%; width: 85vw; max-width: 500px; background: rgba(46, 16, 101, 0.85); backdrop-filter: blur(10px); border: 2px solid rgba(216, 180, 254, 0.8); border-radius: 12px; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); opacity: 0; transform: translateY(-20px); transition: all 0.8s ease; z-index: 120; }
        .custom-alert-box.show { opacity: 1; transform: translateY(0); }
        .custom-alert-title { font-size: 28px; font-weight: 700; color: #facc15; margin-bottom: 12px; letter-spacing: 1px; }
        .custom-alert-desc { font-size: 22px; color: #e9d5ff; line-height: 1.5; white-space: pre-line; }

        .mailbox-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; transform: scale(0); transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1); margin-top: 50px; z-index: 115; }
        .mailbox-img { width: 180px; image-rendering: pixelated; filter: drop-shadow(0 0 35px rgba(216, 180, 254, 0.9)); position: relative; z-index: 2; }
        
        /* HOẠT ẢNH THƯ RƠI CHÍNH XÁC VÀO HÒM (Kích thước lớn hơn, vị trí tuyệt đối) */
        .incoming-letter { position: absolute; top: -150px; left: 50%; width: 90px; /* Thư to rõ ràng */ margin-left: -45px; opacity: 0; z-index: 1; /* Nằm sau mặt hòm thư */ image-rendering: pixelated; }
        .animate-incoming { animation: physicalInsert 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes physicalInsert { 
            0% { transform: translateY(-100px) scale(1.2); opacity: 0; } 
            20% { opacity: 1; } 
            100% { transform: translateY(40px) scale(0.9); opacity: 0; /* Trượt hoàn toàn vào trong hòm */ } 
        }

        .letter-counter { font-size: 26px; font-weight: 700; color: #ffffff; background: rgba(46, 16, 101, 0.9); padding: 8px 30px; border-radius: 30px; border: 2px solid #d8b4fe; margin-top: -20px; z-index: 3; opacity: 0; transition: opacity 1s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
        
        .spilled-letter { position: absolute; width: 60px; cursor: pointer; opacity: 0; z-index: 111; transition: transform 0.3s ease, filter 0.3s ease; image-rendering: pixelated; will-change: transform; }
        .spilled-letter:hover { transform: scale(1.2) !important; filter: drop-shadow(0 0 15px rgba(250, 204, 21, 0.9)); z-index: 112; }
        @keyframes massSpillOut { 0% { top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; } 30% { opacity: 1; } 100% { opacity: 1; } }

        /* ---------------- GIAO DIỆN XÁC THỰC ADMIN ---------------- */
        #password-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; z-index: 300; }
        .security-box { position: relative; display: flex; flex-direction: column; align-items: center; background: rgba(30, 10, 70, 0.95); border: 3px dashed #d8b4fe; padding: 40px 60px; border-radius: 15px; box-shadow: 0 0 50px rgba(0,0,0,0.9); transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .close-pass-btn { position: absolute; top: -15px; right: -15px; width: 35px; height: 35px; background: #facc15; color: #150824; border-radius: 50%; font-family: sans-serif; font-size: 18px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid #3b0764; transition: transform 0.2s ease; }
        .close-pass-btn:hover { transform: scale(1.1); }
        
        .lock-animation-area { display: flex; justify-content: center; align-items: center; position: relative; width: 200px; height: 160px; margin-bottom: 25px; }
        
        /* VẼ Ổ KHÓA BẰNG CSS THUẦN (PURE CSS LOCK) */
        .css-lock { position: relative; width: 100px; height: 130px; display: flex; flex-direction: column; align-items: center; z-index: 3; }
        .css-lock-shackle { width: 50px; height: 40px; border: 14px solid #bba0e8; border-bottom: none; border-radius: 35px 35px 0 0; }
        .css-lock-body { width: 100%; height: 75px; background: #d4bfff; border-radius: 20px; border: 4px solid #9c73e8; box-shadow: inset -5px -5px 0 rgba(0,0,0,0.15), 0 10px 20px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; position: relative; }
        .css-lock-hole { width: 12px; height: 30px; background: #2a1b42; border-radius: 6px; position: relative; }
        .css-lock-hole::after { content: ''; position: absolute; top: 22px; left: -4px; width: 20px; height: 20px; background: #2a1b42; border-radius: 50%; }

        /* VẼ CHÌA KHÓA BẰNG CSS THUẦN (PURE CSS KEY) */
        .css-key { position: absolute; right: -120px; top: 60px; width: 100px; height: 35px; display: flex; align-items: center; z-index: 4; opacity: 0; transform-origin: 10px center; /* Tâm xoay tại mũi chìa */ transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease; }
        .css-key-shaft { width: 60px; height: 12px; background: #ffd700; border-top: 2px solid #b8860b; border-bottom: 2px solid #b8860b; position: relative; border-radius: 5px 0 0 5px; }
        .css-key-teeth { position: absolute; left: 10px; bottom: -14px; width: 16px; height: 14px; background: #ffd700; border: 2px solid #b8860b; border-top: none; border-radius: 0 0 4px 4px; }
        .css-key-teeth::after { content: ''; position: absolute; left: 20px; bottom: 0; width: 12px; height: 10px; background: #ffd700; border: 2px solid #b8860b; border-top: none; border-radius: 0 0 4px 4px; }
        .css-key-head { width: 40px; height: 40px; background: #ffd700; border: 3px solid #b8860b; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-left: -5px; box-shadow: inset -3px -3px 0 rgba(0,0,0,0.1); }
        .css-key-gem { width: 18px; height: 24px; background: #800080; border-radius: 50%; border: 2px solid #4b004b; box-shadow: inset -2px -2px 0 rgba(255,255,255,0.4); }

        /* Trạng thái đâm xuyên và xoay */
        .key-insert { opacity: 1; transform: translateX(-155px) rotate(0deg); }
        .key-turn { opacity: 1; transform: translateX(-155px) rotate(90deg); }
        
        .pass-input { background: transparent; border: none; border-bottom: 2px solid #facc15; color: #facc15; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 700; text-align: center; width: 220px; outline: none; letter-spacing: 4px; margin-bottom: 25px; }
        .pass-submit-btn { background: #d8b4fe; color: #150824; border: none; padding: 12px 40px; font-family: 'Cormorant Garamond', serif; font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 20px; letter-spacing: 1.5px; transition: background 0.3s ease; }
        .pass-submit-btn:hover { background: #c084fc; }

        /* ---------------- GIAO DIỆN CUỘN THÁNH CHỈ CSS THUẦN ---------------- */
        #scroll-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.9); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; z-index: 350; }
        
        .scroll-wrapper { display: flex; flex-direction: column; align-items: center; position: relative; width: 90vw; max-width: 500px; }
        
        /* Trục gỗ bằng CSS */
        .css-scroll-roller { width: 100%; height: 35px; background: linear-gradient(to bottom, #a05a2c 0%, #6b3e1b 100%); border: 3px solid #3d210b; border-radius: 15px; position: relative; z-index: 3; flex-shrink: 0; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .css-scroll-roller::before, .css-scroll-roller::after { content: ''; position: absolute; top: 50%; transform: translateY(-50%); width: 15px; height: 25px; background: #824721; border: 2px solid #3d210b; border-radius: 4px; }
        .css-scroll-roller::before { left: -10px; } 
        .css-scroll-roller::after { right: -10px; }

        /* Giấy cuộn bằng CSS */
        .scroll-middle { 
            width: 90%; background: #ebd5ab; /* Mã màu giấy da */
            border-left: 4px solid #c9a370; border-right: 4px solid #c9a370;
            max-height: 0px; overflow: hidden; display: flex; flex-direction: column; align-items: center; 
            transition: max-height 2.5s cubic-bezier(0.34, 1.56, 0.64, 1); margin: -5px 0; z-index: 2; 
        }
        .scroll-middle.open { max-height: 65vh; }
        
        /* Căn lề chuẩn bản gốc */
        .scroll-content-text { 
            color: #3b2818; font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; 
            line-height: 1.7; text-align: left; opacity: 0; transition: opacity 1s ease 1.8s; 
            padding: 50px 40px; box-sizing: border-box; width: 100%; 
        }
        .scroll-middle.open .scroll-content-text { opacity: 1; }
        
        .close-scroll-btn { position: absolute; top: -30px; right: -20px; width: 45px; height: 45px; background: rgba(0,0,0,0.8); color: #fff; border: 2px solid #fff; border-radius: 50%; font-family: sans-serif; font-size: 22px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 360; transition: background 0.3s ease, transform 0.2s ease; }
        .close-scroll-btn:hover { background: #facc15; color: #000; transform: scale(1.1); border-color: #000; }
        .hidden { opacity: 0 !important; pointer-events: none !important; }

        /* RESPONSIVE DESIGN */
        @media screen and (max-width: 900px) { .cloud-left, .cloud-right, .piano, .cauldron { display: none !important; } .paper-wrapper { box-shadow: none !important; filter: none !important; transform: translate(-50%, -50%) scale(0.85); transform-origin: center center; } }
        @media screen and (max-width: 768px) { .paper-wrapper { transform: translate(-50%, -50%) scale(0.75); } .scroll-content-text { padding: 40px 30px; font-size: 20px; } }
        @media screen and (max-width: 480px) { .paper-wrapper { transform: translate(-50%, -50%) scale(0.65); } .scroll-content-text { padding: 30px 20px; font-size: 18px; } }
        @media screen and (max-width: 390px) { .paper-wrapper { transform: translate(-50%, -50%) scale(0.6); } }
    </style>
</head>
<body>

    <div class="stars-layer" id="stars-layer"></div>

    <div id="scene-1">
        <img src="assets/clouds.png" class="cloud-right" alt="Mây phải">
        <img src="assets/piano.png" class="piano" alt="Piano">
        
        <div class="paper-wrapper">
            <div class="input-group">
                <label for="sender">From:</label>
                <input type="text" id="sender" class="paper-input" placeholder="Tên của bạn...">
            </div>
            <textarea id="message" class="paper-textarea" placeholder="Viết lời nhắn gửi đến những vì sao..."></textarea>
            
            <div class="submit-section" onclick="processSubmission()">
                <div class="submit-btn">To the star holder</div>
                <img src="assets/witch.png" id="witch" class="witch-character" alt="Witch">
            </div>
        </div>

        <img src="assets/cauldron.png" class="cauldron" alt="Vạc ma thuật">
        <img src="assets/clouds.png" class="cloud-left" alt="Mây trái">
    </div>

    <div id="scene-2">
        <div class="galaxy-spiral"></div>
        <img src="assets/letter.png" id="flying-envelope" class="flying-envelope">
    </div>

    <div id="scene-3">
        <div class="custom-alert-box" id="custom-notification">
            <div class="custom-alert-title" id="notif-title">Gửi Thành Công! ✨</div>
            <div class="custom-alert-desc" id="sequence-message">Bạn là người thứ... gửi thư đến dải ngân hà.</div>
        </div>

        <!-- Hòm thư bọc ngoài chứa sẵn lá thư rớt -->
        <div class="mailbox-wrapper" id="mailbox-container">
            <img src="assets/letter.png" class="incoming-letter" id="incoming-letter" alt="Thư tới">
            <img src="assets/mailbox.png" class="mailbox-img" alt="Hòm Thư">
            <div class="letter-counter" id="letter-counter">0 Thư</div>
        </div>
        
        <div id="spilled-letters-area"></div>
    </div>

    <div id="password-modal">
        <div class="security-box" id="security-box">
            <div class="close-pass-btn" onclick="closePasswordModal()">X</div>
            
            <div class="lock-animation-area">
                <!-- Ổ KHÓA CSS -->
                <div class="css-lock">
                    <div class="css-lock-shackle"></div>
                    <div class="css-lock-body">
                        <div class="css-lock-hole"></div>
                    </div>
                </div>
                <!-- CHÌA KHÓA CSS -->
                <div class="css-key" id="auth-key">
                    <div class="css-key-shaft">
                        <div class="css-key-teeth"></div>
                    </div>
                    <div class="css-key-head">
                        <div class="css-key-gem"></div>
                    </div>
                </div>
            </div>
            
            <input type="password" id="letter-pass" class="pass-input" placeholder="MẬT CHÚ">
            <button class="pass-submit-btn" onclick="verifyAdminPassword()">MỞ KHÓA</button>
        </div>
    </div>

    <div id="scroll-modal">
        <div class="scroll-wrapper">
            <div class="close-scroll-btn" onclick="closeScroll()">X</div>
            
            <!-- THÁNH CHỈ CSS -->
            <div class="css-scroll-roller top"></div>
            <div class="scroll-middle" id="magic-scroll">
                <div class="scroll-content-text">
                    <strong>Gửi từ: <span id="display-sender">...</span></strong><br><br>
                    <span id="display-message">Nội dung thư...</span>
                </div>
            </div>
            <div class="css-scroll-roller bottom"></div>
        </div>
    </div>

    <audio id="twinkle-audio" src="assets/twinkle.mp3"></audio>

    <script>
        function processSubmission() {
            const sender = document.getElementById('sender').value.trim();
            const message = document.getElementById('message').value.trim();

            if (sender.toLowerCase() === 'starprincess') {
                openPasswordModal();
                return;
            }

            if (!sender || !message) {
                alert("Bạn vui lòng điền đầy đủ tên và lời nhắn nhé! ✨");
                return; 
            }
            runGuestFlow(sender, message);
        }

        function runGuestFlow(sender, message) {
            const witch = document.getElementById('witch');
            witch.style.transform = "rotate(-30deg) translateY(-20px)";

            setTimeout(() => {
                witch.style.transform = "rotate(0deg) translateY(0)";
                document.getElementById('scene-1').classList.add('hidden');
                document.getElementById('stars-layer').style.opacity = '0';
                document.getElementById('scene-2').style.opacity = '1';
                document.getElementById('scene-2').style.pointerEvents = 'auto';
                document.getElementById('flying-envelope').classList.add('envelope-fly-animation');
                document.getElementById('twinkle-audio').play().catch(() => {});

                setTimeout(() => {
                    const sequenceNumber = Math.floor(Math.random() * (259 - 50 + 1)) + 50;
                    initGuestPhaseTwo(sequenceNumber);
                }, 4000); 
            }, 600);
        }

        function initGuestPhaseTwo(sequenceNumber) {
            document.getElementById('scene-2').classList.add('hidden');
            const scene3 = document.getElementById('scene-3');
            scene3.style.opacity = '1';
            scene3.style.pointerEvents = 'auto';

            setTimeout(() => {
                document.getElementById('mailbox-container').style.transform = 'scale(1)';
                
                setTimeout(() => {
                    const incomingLetter = document.getElementById('incoming-letter');
                    incomingLetter.classList.add('animate-incoming');
                    
                    setTimeout(() => {
                        const notif = document.getElementById('custom-notification');
                        document.getElementById('notif-title').innerText = "Gửi Thành Công! ✨";
                        document.getElementById('sequence-message').innerText = `Bạn là người thứ ${sequenceNumber} gửi thư đến dải ngân hà.`;
                        notif.classList.add('show');
                    }, 1800); 
                }, 1200); 
            }, 100);
        }

        function openPasswordModal() {
            const modal = document.getElementById('password-modal');
            const box = document.getElementById('security-box');
            modal.style.opacity = '1';
            modal.style.pointerEvents = 'auto';
            setTimeout(() => { box.style.transform = 'scale(1)'; }, 50);
            
            document.getElementById('letter-pass').value = '';
            const key = document.getElementById('auth-key');
            key.classList.remove('key-insert', 'key-turn');
        }

        function closePasswordModal() {
            const modal = document.getElementById('password-modal');
            const box = document.getElementById('security-box');
            modal.style.opacity = '0';
            modal.style.pointerEvents = 'none';
            box.style.transform = 'scale(0.8)';
        }

        function verifyAdminPassword() {
            const pass = document.getElementById('letter-pass').value.trim();
            if (pass === "") {
                alert("Nữ hoàng vui lòng nhập mật chú!"); 
                return;
            }

            const key = document.getElementById('auth-key');
            key.classList.add('key-insert'); // Đâm vô
            
            setTimeout(() => {
                key.classList.add('key-turn'); // Vặn 90 độ
                
                setTimeout(() => {
                    closePasswordModal(); 
                    deployAdminScene();
                }, 800);
            }, 600); 
        }

        function deployAdminScene() {
            // MỐC THỜI GIAN KIỂM THỬ TẠM THỜI (Hãy đổi số '01' thành '25' khi triển khai thực tế)
            const unlockDate = new Date('2026-09-01T00:00:00'); 
            const currentDate = new Date();
            
            document.getElementById('scene-1').classList.add('hidden');
            document.getElementById('scene-2').classList.add('hidden');
            document.getElementById('stars-layer').style.opacity = '0';
            
            const scene3 = document.getElementById('scene-3');
            scene3.style.opacity = '1';
            scene3.style.pointerEvents = 'auto';

            const notif = document.getElementById('custom-notification');
            const titleEl = document.getElementById('notif-title');
            const descEl = document.getElementById('sequence-message');

            setTimeout(() => {
                document.getElementById('mailbox-container').style.transform = 'scale(1)';

                if (currentDate < unlockDate) {
                    setTimeout(() => {
                        titleEl.innerText = "Hòm Thư Đang Khóa 🔒";
                        descEl.innerText = "Chào mừng Star Princess!\nChưa tới ngày 25/09/2026, thư chưa thể nở ra đâu nha. Ráng đợi thêm xíu nữa!";
                        notif.classList.add('show');
                    }, 1000);
                } else {
                    const totalLetters = 259; 
                    setTimeout(() => {
                        titleEl.innerText = "Kén Thời Gian Đã Mở! ✨";
                        descEl.innerText = `Chào mừng Star Princess trở lại!\nBạn đã nhận được tổng cộng ${totalLetters} lá thư.`;
                        notif.classList.add('show');
                        
                        document.getElementById('letter-counter').style.opacity = '1';
                        document.getElementById('letter-counter').innerText = `${totalLetters} Thư`;
                        
                        setTimeout(() => {
                            notif.classList.remove('show'); 
                            massSpillLetters(totalLetters);
                        }, 3500);
                    }, 1000);
                }
            }, 100);
        }

        function massSpillLetters(total) {
            const area = document.getElementById('spilled-letters-area');
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < total; i++) {
                let letter = document.createElement('img');
                letter.src = 'assets/letter.png';
                letter.className = 'spilled-letter';
                
                let randomX = Math.floor(Math.random() * 90) + 5; 
                let randomY = Math.floor(Math.random() * 85) + 10; 
                let randomRotation = Math.floor(Math.random() * 360);
                let randomScale = (Math.random() * 0.5) + 0.7; 
                let animationDelay = Math.random() * 3.5; 

                letter.style.animation = `massSpillOut 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards ${animationDelay}s`;
                letter.style.top = `${randomY}vh`;
                letter.style.left = `${randomX}vw`;
                letter.style.transform = `translate(-50%, -50%) scale(${randomScale}) rotate(${randomRotation}deg)`;

                letter.onclick = function() {
                    openMagicScroll("Đồng bọn số " + (i+1), "Chúc Star Princess sinh nhật 20 tuổi rực rỡ và luôn hạnh phúc nhé! Đây là nội dung CSS thuần 100%.");
                };
                fragment.appendChild(letter);
            }
            
            area.appendChild(fragment);
        }

        function openMagicScroll(senderName, messageContent) {
            document.getElementById('display-sender').innerText = senderName;
            document.getElementById('display-message').innerText = messageContent;

            const scrollModal = document.getElementById('scroll-modal');
            const scrollPaper = document.getElementById('magic-scroll');
            
            scrollModal.style.opacity = '1';
            scrollModal.style.pointerEvents = 'auto';
            
            setTimeout(() => { scrollPaper.classList.add('open'); }, 200); 
        }

        function closeScroll() {
            const scrollModal = document.getElementById('scroll-modal');
            const scrollPaper = document.getElementById('magic-scroll');
            scrollPaper.classList.remove('open');
            
            setTimeout(() => {
                scrollModal.style.opacity = '0';
                scrollModal.style.pointerEvents = 'none';
            }, 1000);
        }
    </script>
</body>
</html>
